[package]
name = "libudp"
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
description = "A series of tools for libev to assist in UDP"
license = "Apache-2.0"
repository = "https://github.com/edengates/libudp"
keywords = ["network", "udp", "iocp", "io-uring", "epoll"]
categories = ["network-programming", "asynchronous"]
exclude = [".github"]

[dependencies]
libev = "0.4.0"
bytes = "1.12.1"
futures-core = { version = "0.3.34", default-features = false, features = ["alloc"] }
rustc-hash = "2.1.3"
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["event"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.16"
libc = "0.2.191"
